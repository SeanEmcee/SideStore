name: Cellular Background IPA
on:
  push:
    branches: [cellular-background]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cellular-background-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: '26.4'
      - name: Test single-use refresh storage
        run: |
          swiftc SideStore/Core/Shortcuts/PreparedRefreshJobStore.swift scripts/tests/prepared-refresh-main.swift -o /tmp/prepared-refresh-tests
          /tmp/prepared-refresh-tests
      - name: Test Swift VPN socket binding
        run: |
          swiftc -D VPN_BOUND_TESTING scripts/vpn-bound/DeviceSocketBinding.swift scripts/vpn-bound/tests/main.swift -o /tmp/vpn-binding-tests
          /tmp/vpn-binding-tests
      - name: Install packaging tools
        run: brew install ldid xcbeautify
      - name: Test first-launch theme application in UIKit
        run: python3 scripts/tests/theme-launch-smoke.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Build and test VPN-bound device transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          git clone https://github.com/SideStore/idevice.git build/idevice
          git -C build/idevice checkout 3e55c8486b2057e40c1f74aaaa1155c82341cf76
          python3 scripts/vpn-bound/patch_dependencies.py --idevice build/idevice --minimuxer Dependencies/minimuxer
          swiftc -D VPN_BOUND_TESTING Dependencies/minimuxer/Common/DeviceSocketBinding.swift Dependencies/minimuxer/Common/NetworkUtils.swift Dependencies/minimuxer/Common/MinimuxerCommonLogging.swift Dependencies/minimuxer/Common/MinimuxerConstants.swift scripts/vpn-bound/tests/preflight/main.swift -o /tmp/preflight-tests
          /tmp/preflight-tests 2>&1 | tee build/logs/preflight.log
          bash scripts/vpn-bound/build-transport.sh 2>&1 | tee build/logs/transport.log
      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          make -B build MARKETING_VERSION=0.7.0-bg.${{ github.run_number }} 2>&1 | tee build/logs/build.log | xcbeautify --renderer github-actions
          make fakesign ipa
          shasum -a 256 SideStore.ipa > SHA256SUMS.txt
      - name: Check IPA contents
        run: python3 scripts/tests/verify-background-ipa.py SideStore.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: SideStore-Cellular-Background
          path: |
            SideStore.ipa
            SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build/logs/*.log
